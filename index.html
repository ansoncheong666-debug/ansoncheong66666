<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER SPARK: 高智商策略卡牌</title>
    <style>
        :root {
            --bg-color: #0d0e12;
            --panel-bg: rgba(20, 24, 33, 0.85);
            --neon-blue: #00f3ff;
            --neon-pink: #ff0055;
            --neon-green: #39ff14;
            --neon-purple: #b026ff;
            --text-main: #e2e8f0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Canvas 特效層 */
        #fxCanvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        /* 頂部狀態列 */
        .header {
            height: 6vh;
            background: linear-gradient(to bottom, #141821, transparent);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            z-index: 10;
            border-bottom: 1px solid rgba(0, 243, 255, 0.1);
        }

        .header .title {
            font-size: 1.2rem;
            font-weight: bold;
            color: var(--neon-blue);
            text-shadow: 0 0 10px var(--neon-blue);
            letter-spacing: 2px;
        }

        .header .stats {
            display: flex;
            gap: 30px;
            font-size: 0.95rem;
        }

        /* 中部核心戰場 */
        .battle-zone {
            height: 59vh;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 10%;
            position: relative;
            z-index: 5;
        }

        .entity-node {
            background: var(--panel-bg);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 16px;
            padding: 25px;
            width: 280px;
            display: flex;
            flex-direction: column;
            align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.1s ease;
        }

        .entity-node.player { border-left: 4px solid var(--neon-blue); }
        .entity-node.enemy { border-right: 4px solid var(--neon-pink); }

        .intent-icon {
            height: 50px;
            font-size: 1.8rem;
            display: flex;
            align-items: center;
            justify-content: center;
            margin-bottom: 10px;
            animation: pulse 1.5s infinite alternate;
        }

        @keyframes pulse {
            from { transform: scale(1); filter: drop-shadow(0 0 2px rgba(255,0,0,0.5)); }
            to { transform: scale(1.1); filter: drop-shadow(0 0 12px var(--neon-pink)); }
        }

        .avatar {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            background: rgba(255,255,255,0.03);
            margin-bottom: 15px;
            border: 2px solid rgba(255,255,255,0.1);
        }

        .player .avatar { border-color: var(--neon-blue); box-shadow: 0 0 15px rgba(0, 243, 255, 0.2); }
        .enemy .avatar { border-color: var(--neon-pink); box-shadow: 0 0 15px rgba(255, 0, 85, 0.2); }

        .hud-bar {
            width: 100%;
            margin-top: 8px;
        }

        .bar-label {
            display: flex;
            justify-content: space-between;
            font-size: 0.85rem;
            margin-bottom: 4px;
            color: #a0aec0;
        }

        .bar-container {
            width: 100%;
            height: 12px;
            background: #1a202c;
            border-radius: 6px;
            overflow: hidden;
            position: relative;
        }

        .bar-fill {
            height: 100%;
            width: 100%;
            transition: width 0.3s cubic-bezier(0.1, 0.8, 0.3, 1);
        }

        .hp-fill { background: linear-gradient(90deg, #ff416c, #ff4b2b); }
        .player .hp-fill { background: linear-gradient(90deg, #00f3ff, #0077ff); }

        .shield-badge {
            background: #2b6cb0;
            color: white;
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 0.8rem;
            font-weight: bold;
            display: inline-block;
            margin-top: 5px;
            box-shadow: 0 0 8px rgba(0,119,255,0.6);
        }

        .status-container {
            display: flex;
            gap: 8px;
            margin-top: 12px;
            min-height: 24px;
        }

        .status-tag {
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
        }
        .status-vulnerable { background: rgba(176, 38, 255, 0.2); color: #e0a3ff; border: 1px solid var(--neon-purple); }
        .status-bleed { background: rgba(255, 0, 85, 0.2); color: #ff80a3; border: 1px solid var(--neon-pink); }

        /* 底部操作與手牌區 */
        .control-zone {
            height: 35vh;
            background: linear-gradient(to top, #090a0d, transparent);
            display: flex;
            align-items: center;
            padding: 0 5%;
            position: relative;
            z-index: 5;
            border-top: 1px solid rgba(255,255,255,0.03);
        }

        .energy-orb {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            background: radial-gradient(circle, #00f3ff 0%, #0044ff 70%);
            box-shadow: 0 0 25px var(--neon-blue), inset 0 0 20px rgba(255,255,255,0.6);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            border: 2px solid rgba(255,255,255,0.4);
            animation: float 3s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        .energy-orb .value { font-size: 1.8rem; text-shadow: 0 2px 4px rgba(0,0,0,0.5); }
        .energy-orb .label { font-size: 0.7rem; color: rgba(255,255,255,0.8); text-transform: uppercase; }

        .deck-pile {
            font-size: 0.85rem;
            color: #a0aec0;
            background: rgba(255,255,255,0.05);
            padding: 8px 14px;
            border-radius: 6px;
            margin: 0 30px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .hand-container {
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: flex-end;
            height: 100%;
            padding-bottom: 20px;
            position: relative;
        }

        /* 卡牌極致視覺 */
        .card {
            width: 155px;
            height: 220px;
            background: #161a23;
            border: 2px solid rgba(0, 243, 255, 0.2);
            border-radius: 12px;
            margin: 0 -15px;
            position: relative;
            cursor: pointer;
            transition: all 0.25s cubic-bezier(0.25, 1, 0.5, 1);
            display: flex;
            flex-direction: column;
            padding: 14px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.4);
            transform-origin: bottom center;
            z-index: 2;
        }

        .card:hover {
            transform: translateY(-55px) scale(1.22) rotate(0deg) !important;
            border-color: var(--neon-blue);
            box-shadow: 0 15px 30px rgba(0, 243, 255, 0.4);
            z-index: 100 !important;
            background: #1c2331;
        }

        .card.card-attack { border-color: rgba(255, 0, 85, 0.3); }
        .card.card-attack:hover { border-color: var(--neon-pink); box-shadow: 0 15px 30px rgba(255,0,85,0.4); }
        .card.card-strategy { border-color: rgba(176, 38, 255, 0.3); }
        .card.card-strategy:hover { border-color: var(--neon-purple); box-shadow: 0 15px 30px rgba(176,38,255,0.4); }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
        }

        .card-title {
            font-size: 0.95rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .card-cost {
            width: 24px;
            height: 24px;
            background: #00f3ff;
            color: #000;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            font-size: 0.85rem;
        }
        .card-attack .card-cost { background: var(--neon-pink); color: white; }
        .card-strategy .card-cost { background: var(--neon-purple); color: white; }

        .card-type {
            font-size: 0.7rem;
            text-transform: uppercase;
            color: #718096;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .card-desc {
            font-size: 0.8rem;
            color: #cbd5e0;
            line-height: 1.4;
            flex-grow: 1;
        }

        /* 全螢幕覆蓋選單（開始與結束） */
        .overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 11, 15, 0.95);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s ease;
